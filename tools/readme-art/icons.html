<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
/* README feature icons: the app's own icons (ui-icons.js) on Steam's blue, like its setup steps.
   Rendered at 2x (SCALE=2). */
.row{display:flex;gap:20px;padding:4px}
.i{width:56px;height:56px;border-radius:2px;background:var(--rt-accent-fill);display:grid;place-items:center;color:#fff}
.i.green{background:var(--rt-green);box-shadow:inset 0 0 0 1px var(--rt-green-line)}
.i .ic{width:30px;height:30px}
.ic{overflow:visible}.ic-p{display:none}
.ic-v .b,.ic-v .d,.ic-v .s{fill:none;stroke:currentColor;stroke-width:1.6px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.i svg.own *{fill:none;stroke:#fff;stroke-width:1.6px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
</style><script src="../../browser-extension/ui-icons.js"></script></head><body><div class="row">
<div class="i" data-shot="icon-voice" data-icon="voice"></div>
<div class="i" data-shot="icon-chat" data-icon="chat"></div>
<div class="i" data-shot="icon-sounds" data-icon="sounds"></div>
<div class="i" data-shot="icon-music"><svg class="ic own" viewBox="0 0 20 20"><path d="M7.5 15V5l9-2v10"/><circle cx="5.5" cy="15" r="2"/><circle cx="14.5" cy="13" r="2"/></svg></div>
<div class="i" data-shot="icon-games" data-icon="games"></div>
<div class="i" data-shot="icon-themes" data-icon="appearance"></div>
<div class="i" data-shot="icon-remote"><svg class="ic own" viewBox="0 0 20 20"><rect x="5.5" y="2" width="9" height="16" rx="1.6"/><path d="M8.6 15.2h2.8"/><path d="M8 6.5l3 2-3 2z"/></svg></div>
<div class="i" data-shot="icon-stay"><svg class="ic own" viewBox="0 0 20 20"><path d="M2 10.5h3.2l1.6-3.6 2.6 7 2.2-5.2 1.3 1.8H18"/></svg></div>
</div><script>TylerIcons.fill();</script></body></html>
