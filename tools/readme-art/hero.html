<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
/* README hero: Tyler's own header from the panel, next to a real screenshot of the panel
   (render.mjs fills [data-panel] from tools/preview/panel.html, Steam theme, on air). */
.bg{width:1280px;height:420px;background:linear-gradient(180deg,#2a475e 0,#1b2838 300px)}
.id{position:absolute;left:56px;top:80px;display:flex;align-items:center;gap:24px}
.id .avatar{width:112px;height:112px}
.id .avatar img{width:100%;height:100%;display:block}
.wordmark{font-size:56px;line-height:1}
.ident-sub{font-size:15px;margin-top:12px}
.lede{position:absolute;left:56px;top:232px;width:640px;margin:0;font-size:19px;line-height:1.5;color:var(--rt-ink)}
.lede b{color:var(--rt-ink-strong);font-weight:700}
.tags{position:absolute;left:56px;top:340px;display:flex;gap:8px;flex-wrap:wrap;width:700px}
.panel{position:absolute;right:64px;top:36px;width:392px;height:420px;overflow:hidden}
.panel .shot{width:392px}
.fade{position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(180deg,rgba(27,40,56,0),#1b2838 85%)}
</style></head><body><div class="bg">
<div class="id"><div class="avatar"><img src="../../browser-extension/ui/logos/steam.png" alt=""></div>
<div><div class="wordmark">ROBOTIC TYLER</div><div class="ident-sub">AI squadmate for Steam chat and voice</div></div></div>
<p class="lede"><b>He joins your Steam group chat and voice channel</b> and talks like one of the crew: replies in text, answers out loud, runs trivia and votes, plays sounds and music.</p>
<div class="tags"><span class="tag green">Free</span><span class="tag blue">Windows app</span><span class="tag blue">Chrome extension</span><span class="tag blue">Gemini Live voice</span><span class="tag blue">Phone remote</span><span class="tag blue">25 themes</span></div>
<div class="panel"><img class="shot" data-panel="hero" alt=""><div class="fade"></div></div>
</div></body></html>
