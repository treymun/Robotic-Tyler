<!doctype html><meta charset="utf-8"><title>Mock Steam chat (desktop voice check)</title><body><h1>Mock Steam chat</h1><iframe id="srv" style="display:none"></iframe>
<script>
// Plays Steam's part, shaped like Steam's real descriptions: the friend is already talking when the
// bot joins, so their audio first arrives on section 0; then they're listed in their own section,
// leave (section inactive), rejoin and leave again. Steam asks for the microphone with the old
// callback API, and ends the call when a description is rejected.
// Music DJ and screen sharing, started by a (simulated) click.
window.__shareChecks=async()=>{
 const out={},wait=ms=>new Promise(r=>setTimeout(r,ms));
 // What the audio bridge does for "Share that window's audio".
 try{
  const s=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true,selfBrowserSurface:'exclude',systemAudio:'exclude'});
  const v=s.getVideoTracks()[0],a=s.getAudioTracks();
  const ac=new AudioContext(),an=ac.createAnalyser();an.fftSize=2048;if(a.length)ac.createMediaStreamSource(new MediaStream(a)).connect(an);
  let peak=0;const buf=new Float32Array(2048);for(let i=0;i<30;i++){await wait(50);an.getFloatTimeDomainData(buf);for(const x of buf)peak=Math.max(peak,Math.abs(x));}
  out.music={audioTracks:a.length,surface:v?.getSettings?.().displaySurface||'',label:v?.label||'',peak:Math.round(peak*1000)/1000};
  for(const t of s.getTracks())t.stop();
 }catch(e){out.music={error:e.name+': '+e.message};}
 // The bridge itself: its music-capture command and the status it reports.
 const statuses=[];const onMsg=e=>{if(e.data?.source==='tyler-music-status')statuses.push(e.data.text);};window.addEventListener('message',onMsg);
 window.postMessage({source:'tyler-audio-command',type:'music-capture',volume:.35},location.origin);await wait(2500);window.postMessage({source:'tyler-audio-command',type:'music-disconnect'},location.origin);await wait(300);
 window.removeEventListener('message',onMsg);out.musicBridge=statuses;
 // Screen awareness: a picture only.
 try{
  const s=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:1},audio:false});
  const v=s.getVideoTracks()[0];out.screen={surface:v?.getSettings?.().displaySurface||'',audioTracks:s.getAudioTracks().length};for(const t of s.getTracks())t.stop();
 }catch(e){out.screen={error:e.name+': '+e.message};}
 return out;
};
window.__checkDone=(async()=>{
 const out={ua:navigator.userAgent,steps:[]};const step=s=>out.steps.push(s);
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 await wait(1500); // Tyler's synthetic microphone is switched on by the preload at document start
 // 1. Steam's microphone request (callback form).
 const mic=await new Promise(resolve=>{const t=navigator;t.getUserMedia=t.getUserMedia||t.webkitGetUserMedia;t.getUserMedia({audio:{optional:[{googHighpassFilter:true}]},video:false},s=>resolve(s),e=>resolve(e));});
 out.mic=mic instanceof MediaStream?{ok:true,label:mic.getAudioTracks()[0]?.label||''}:{ok:false,error:String(mic&&mic.name||mic)};
 // 2. The local speech detector (MAIN-world client → isolated bridge → app-served frame).
 try{out.neural=await Promise.race([window.TylerNeural.ready().then(()=>'ready'),wait(25000).then(()=>'timeout')]);}catch(e){out.neural='error '+(e&&e.message);}
 // 3. A call that someone leaves.
 if(!(mic instanceof MediaStream)){out.call='no microphone stream';return out;}
 const SrvPC=document.getElementById('srv').contentWindow.RTCPeerConnection;
 const ac=new AudioContext(),osc=f=>{const o=ac.createOscillator(),g=ac.createGain();g.gain.value=.4;o.frequency.value=f;o.connect(g);const d=ac.createMediaStreamDestination();g.connect(d);o.start();return d.stream;};
 const bot=new RTCPeerConnection({sdpSemantics:'plan-b'}),srv=new SrvPC();
 bot.onicecandidate=e=>e.candidate&&srv.addIceCandidate(e.candidate).catch(()=>{});srv.onicecandidate=e=>e.candidate&&bot.addIceCandidate(e.candidate).catch(()=>{});
 bot.addTrack(mic.getAudioTracks()[0],mic);
 const secs=sdp=>{const p=sdp.split(/\r\n(?=m=)/);return {head:p[0],m:p.slice(1)};};
 const join=s=>[s.head,...s.m].join('\r\n').replace(/(\r\n)+$/,'')+'\r\n';
 const noSsrc=m=>m.split('\r\n').filter(l=>l&&!/^a=(ssrc|ssrc-group|msid):/.test(l)).join('\r\n');
 const ssrc=sdp=>(/a=ssrc:(\d+)/.exec(sdp)||[])[1];
 let ended=null;
 async function apply(d,label){if(ended)return;try{await bot.setRemoteDescription(d);if(d.type==='offer'){const a=await bot.createAnswer();await bot.setLocalDescription(a);await srv.setRemoteDescription(bot.localDescription);}step(label+' ok');}catch(e){ended=label+': '+e.message;bot.close();step(label+' FAILED');}}
 await bot.setLocalDescription(await bot.createOffer());await srv.setRemoteDescription(bot.localDescription);
 const friend=osc(650),t0=srv.getTransceivers()[0];await t0.sender.replaceTrack(friend.getAudioTracks()[0]);t0.direction='sendrecv';
 const ans=await srv.createAnswer();await srv.setLocalDescription(ans);const a=secs(ans.sdp);a.m[0]=noSsrc(a.m[0]);
 await apply({type:'answer',sdp:join(a)},'join');
 const self=ssrc(bot.localDescription.sdp),X=ssrc(srv.localDescription.sdp);
 async function steam(dir){const o=await srv.createOffer();await srv.setLocalDescription(o);const s=secs(o.sdp);
  s.m[0]=noSsrc(s.m[0]).replace(/\r\na=mid:0/,'\r\na=mid:0\r\na=msid:Self-'+self+' '+self)+'\r\na=ssrc:'+self+' cname:Self-'+self;
  s.m[1]=noSsrc(s.m[1]).replace(/a=(sendonly|sendrecv|inactive|recvonly)/,'a='+dir).replace(/\r\na=mid:1/,'\r\na=mid:1\r\na=msid:Peer-'+X+' '+X)+'\r\na=ssrc:'+X+' cname:Peer-'+X;
  return {type:'offer',sdp:join(s)};}
 await wait(2500);
 srv.addTransceiver('audio',{direction:'sendonly'});await apply(await steam('sendonly'),'friend listed');
 await wait(2500);await apply(await steam('inactive'),'friend leaves');
 await wait(1500);await apply(await steam('sendonly'),'friend rejoins');
 await wait(1500);await apply(await steam('inactive'),'friend leaves again');
 await wait(1000);
 const stats=await bot.getStats();let sent=0;stats.forEach(s=>{if(s.type==='outbound-rtp')sent+=s.packetsSent||0;});
 out.call=ended?'dropped: '+ended:'stayed ('+bot.connectionState+')';out.botPacketsSent=sent;
 bot.close();srv.close();return out;
})();
</script>
