# REAL test of theme voices on Windows (no graphics card): installs the voice engine and the
# Lightweight model from their real sources with the app's own installer, starts the voice worker
# and makes the voice check's line on the processor. Run by hand: Actions → Theme voices on
# Windows → Run workflow (choose the engine). Downloads about 5 GB from PyTorch, PyPI and Hugging Face.
name: Theme voices on Windows

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Engine to install (windows-cuda, windows-cuda-fast or windows-cpu)
        type: choice
        options: [windows-cuda, windows-cuda-fast, windows-cpu]
        default: windows-cuda

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and speak (real engine, processor)
        env:
          RT: ${{ inputs.runtime }}
        run: node tools/theme-voices/windows-smoke.cjs "$env:RUNNER_TEMP\TylerThemeVoices"
